  <div class="tweet-content">
  看到有好多人都在疯了一样的梭哈标普500，现在标普500估值泡沫已经极度虚高，达到了历史平均水平的2倍还多。即使后面继续爬上新高，按照均值回归的逻辑，也一定会在某一个时刻腰斩的。
  <br/>
  如果实在想参与标普500的上涨，最好做一些防御。例如说：做标普500的做多网格，下跌买入，上涨卖出，新高上移买单。买单范围在50％至100％区间。
  <br/>
  <br/>
  这样即使发生最坏的情况：标普500忽然暴跌50％，那亏损也可以控制在20％左右。
